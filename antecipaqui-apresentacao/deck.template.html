<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Antecipaqui · Apresentação da Plataforma</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --a:#3f8fe8; --a-soft:#8ec2f7; --a-deep:#0d4e9e; --a-vivid:#1c6dd0;
  --ink:#081222; --panel:#0d1a30; --panel2:#122239;
  --line:rgba(142,194,247,.10); --line2:rgba(142,194,247,.18);
  --tx:#f2f6fb; --mut:#93a4bc; --mut2:#5c6d85;
  --red:#fb7185; --amber:#fbbf24; --grn:#34d399; --org:#fb923c;
  --sans:'Inter',system-ui,sans-serif; --disp:'Sora','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
img{max-width:100%;display:block}

#deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
#deck::-webkit-scrollbar{width:0}
.slide{min-height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;padding:64px 88px 72px;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse 90% 80% at 70% 30%,#000 20%,transparent 80%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none}
.glow.a{width:540px;height:540px;background:var(--a-vivid);top:-170px;right:-130px}
.glow.b{width:420px;height:420px;background:#0f766e;bottom:-180px;left:-140px;opacity:.15}

#bar{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.06);z-index:60}
#bar>i{display:block;height:100%;width:0;background:var(--a);box-shadow:0 0 18px var(--a);transition:width .3s}
#hud{position:fixed;top:18px;right:26px;z-index:60;display:flex;align-items:center;gap:14px;font-family:var(--disp);font-size:12px;color:var(--mut)}
#hud b{color:var(--tx);font-weight:700}
#hud .k{border:1px solid var(--line2);border-radius:7px;padding:4px 8px;color:var(--mut);cursor:pointer;transition:.2s}
#hud .k:hover{color:#fff;background:var(--a-vivid);border-color:var(--a-vivid)}
#rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:11px}
#rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--mut2);font-size:11px;font-family:var(--disp);font-weight:600;letter-spacing:.02em}
#rail .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mut2);transition:.25s;flex:none}
#rail a .t{opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap}
#rail a:hover .t,#rail a.on .t{opacity:1;transform:none}
#rail a.on{color:var(--a-soft)}
#rail a.on .d{background:var(--a);border-color:var(--a);box-shadow:0 0 12px var(--a);transform:scale(1.15)}

.kick{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--a-soft);display:flex;align-items:center;gap:12px}
.kick::before{content:"";width:26px;height:2px;background:var(--a);display:inline-block;border-radius:2px}
h1.big{font-family:var(--disp);font-weight:800;font-size:clamp(38px,5.2vw,72px);line-height:1.04;letter-spacing:-.025em;margin:18px 0}
h2.sec{font-family:var(--disp);font-weight:800;font-size:clamp(30px,3.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 10px}
.lead{font-size:clamp(16px,1.5vw,20px);color:var(--mut);max-width:52ch;line-height:1.55}
.kid{font-size:17px;line-height:1.6;color:#e3e9f2;max-width:52ch}
.kid b{color:var(--a-soft);font-weight:700}
.kid .em{background:linear-gradient(transparent 62%,rgba(63,143,232,.32) 0);padding:0 2px}

#cover,#end{text-align:center;align-items:center}
.wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.03em}
.wordmark .am{display:inline-flex;width:1.12em;height:1.12em;border-radius:.26em;background:linear-gradient(135deg,var(--a-vivid),var(--a-deep));color:#fff;align-items:center;justify-content:center;margin-right:12px;vertical-align:-12%;font-size:.85em}
.wordmark b{color:var(--a-soft);font-weight:700}
#cover .kick,#end .kick{justify-content:center;margin-top:26px}
#cover h1 .l,#end h2 .l{color:var(--a-soft)}
#cover .sub{font-size:clamp(16px,1.6vw,21px);color:var(--mut);max-width:64ch;margin:8px auto 0}
.meta{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:space-between;padding:0 88px;font-size:12px;color:var(--mut2);font-family:var(--disp)}
kbd{border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-family:var(--disp);font-size:10px}
.cta{display:inline-block;margin-top:30px;background:linear-gradient(135deg,var(--a-vivid),var(--a-deep));color:#fff;font-family:var(--disp);font-weight:800;font-size:17px;padding:16px 34px;border-radius:999px;box-shadow:0 14px 44px -10px rgba(28,109,208,.6)}
.contact{margin-top:22px;font-size:13px;color:var(--mut)}
.contact b{color:var(--tx)}

.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.v{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
.v .ic{font-size:30px;margin-bottom:12px}
.v h3{font-family:var(--disp);font-weight:700;font-size:19px;margin-bottom:8px}
.v p{font-size:13.5px;color:var(--mut);line-height:1.55}
.overline{margin-top:30px;font-size:12.5px;color:var(--mut2);font-family:var(--disp)}

.levelintro{position:relative;z-index:2;max-width:1300px;margin:0 auto;width:100%}
.levelintro .no{font-family:var(--disp);font-weight:800;font-size:clamp(70px,9vw,130px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--a);opacity:.9}
.levelintro .who{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--a-soft)}
.levelintro h2{font-family:var(--disp);font-weight:800;font-size:clamp(38px,5vw,68px);letter-spacing:-.02em;line-height:1.02}
.levelintro .lead{margin-top:18px}
.idx{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px;max-width:900px}
.idx span{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:20px}
.idx span b{color:var(--a-soft);margin-right:6px}

.feat{position:relative;z-index:2;display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:60px;align-items:center;width:100%;max-width:1500px;margin:0 auto}
.feat .txt .num{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--mut2)}
.feat .txt h2{font-family:var(--disp);font-weight:800;font-size:clamp(28px,3vw,44px);line-height:1.06;letter-spacing:-.02em;margin:14px 0 16px}
.feat .txt h2 .hl{color:var(--a-soft)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:6px 12px}
.pill.acc{background:rgba(63,143,232,.14);border-color:rgba(63,143,232,.45);color:var(--a-soft)}

.mockwrap{position:relative}
.mockwrap::after{content:"";position:absolute;inset:-30px;background:radial-gradient(60% 60% at 50% 40%,rgba(28,109,208,.13),transparent 70%);z-index:-1}
.browser{background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.browser .top{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#091426;border-bottom:1px solid var(--line)}
.browser .top i{width:11px;height:11px;border-radius:50%;background:#20304a;display:inline-block}
.browser .top .url{margin-left:12px;flex:1;background:#0f1e36;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:11px;color:var(--mut);font-family:var(--disp)}
.browser .top .url b{color:var(--a-soft)}
.browser .body{padding:20px}
.phone{width:270px;margin:0 auto;background:var(--panel);border:8px solid #122239;border-radius:38px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.8);position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:20px;background:#122239;border-radius:12px;z-index:5}
.phone .scr{padding:34px 14px 18px;min-height:490px}
.app{display:grid;grid-template-columns:158px 1fr;min-height:340px}
.app .side{background:#091426;border-right:1px solid var(--line);padding:14px 12px}
.app .side .lg{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:12.5px;margin-bottom:16px}
.app .side .lg .m{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--a-vivid),var(--a-deep))}
.app .side .nv{font-size:11px;color:var(--mut);padding:7px 9px;border-radius:7px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.app .side .nv.on{background:rgba(63,143,232,.14);color:var(--a-soft);font-weight:700}
.app .side .nv .ic{width:14px;height:14px;border-radius:4px;background:currentColor;opacity:.5}
.app .main{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.kpi .l{font-size:10.5px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;font-family:var(--disp)}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:22px;margin-top:5px;letter-spacing:-.02em}
.kpi .dl{font-size:11px;margin-top:3px;color:var(--grn);font-weight:600}
.kpi.hi{background:linear-gradient(160deg,rgba(63,143,232,.18),rgba(63,143,232,.03));border-color:rgba(63,143,232,.4)}
.kpi.hi .v{color:var(--a-soft)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .h{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .h .tag{font-size:10px;color:var(--a-soft);background:rgba(63,143,232,.13);border-radius:5px;padding:2px 7px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:9px;height:110px}
.bars .b{flex:1;background:linear-gradient(180deg,var(--a),rgba(63,143,232,.22));border-radius:5px 5px 0 0;min-height:6px}
.line-lbls{display:flex;gap:9px;margin-top:8px}
.line-lbls span{flex:1;text-align:center;font-size:9px;color:var(--mut2);font-family:var(--disp)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows .r{display:grid;grid-template-columns:1.6fr 1fr 1fr .8fr;gap:8px;padding:10px 13px;background:var(--panel2);font-size:11.5px;align-items:center}
.rows .r.hd{background:#091426;color:var(--mut);font-family:var(--disp);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.rows .r b{font-weight:600}
.st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;justify-self:start}
.st.ok{background:rgba(52,211,153,.15);color:var(--grn)}
.st.wa{background:rgba(251,191,36,.15);color:var(--amber)}
.st.no{background:rgba(251,113,133,.15);color:var(--red)}
.st.bl{background:rgba(63,143,232,.16);color:var(--a-soft)}
.list{display:flex;flex-direction:column;gap:7px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11.5px}
.li .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,var(--a-vivid),var(--a-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;font-family:var(--disp);flex:none}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-weight:600}
.li .g small{color:var(--mut);font-size:10px}
.progressbar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.progressbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a-deep))}
.kan{display:flex;gap:7px}
.kan>div{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:8px}
.kan h6{margin:0 0 7px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-family:var(--disp)}
.kan .c{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:9.5px;margin-bottom:5px}
.kan .c small{color:var(--mut);display:block;font-size:8.5px}
.mapmk{position:relative;height:150px;border-radius:12px;background:linear-gradient(160deg,#122a45,#0b1729);overflow:hidden}
.mapmk::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.mapmk .pin{position:absolute;width:13px;height:13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff}
.big-money{background:linear-gradient(120deg,var(--a-deep),var(--a-vivid));border-radius:16px;padding:16px;margin-bottom:10px}
.big-money small{color:rgba(255,255,255,.75);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-family:var(--disp)}
.big-money b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;margin-top:3px}
.flow{display:flex;flex-direction:column;gap:8px}
.flow .ef{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:11.5px}
.flow .ef .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--a-vivid),var(--a-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:12px;flex:none}
.flow .ef.hi{border-color:rgba(52,211,153,.4);background:linear-gradient(160deg,rgba(52,211,153,.1),transparent)}
.contractmk{background:#f5f7fa;color:#1a2536;border-radius:12px;padding:16px;max-width:340px;margin:0 auto;font-size:10px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.contractmk h5{font-family:var(--disp);font-size:12px;margin-bottom:8px;color:#0c1a2c}
.contractmk .ln{height:5px;background:#d7dee8;border-radius:3px;margin-bottom:5px}
.contractmk .sig{margin-top:12px;border-top:1.5px dashed #b7c2d2;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.contractmk .sig .as{font-family:'Bradley Hand',cursive;font-size:15px;color:#0d4e9e;transform:rotate(-3deg)}
.gauge{display:flex;align-items:center;gap:14px}
.gauge .gnum{font-family:var(--disp);font-weight:800;font-size:38px;color:var(--grn)}

.revgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.rev .ic{font-size:22px}
.rev h4{font-family:var(--disp);font-weight:700;font-size:14.5px;margin:8px 0 4px}
.rev p{font-size:11.5px;color:var(--mut);line-height:1.5}
.rev b{color:var(--a-soft)}

@media (max-width:980px){
  .slide{padding:56px 26px 64px}
  #rail{display:none}
  .feat{grid-template-columns:1fr;gap:30px}
  .feat .mockwrap{order:-1}
  .vg{grid-template-columns:1fr}
  .revgrid{grid-template-columns:1fr 1fr}
  .meta{padding:0 26px}
  .phone{width:240px}.phone .scr{min-height:430px}
  .app{grid-template-columns:1fr}.app .side{display:none}
}
@media (max-width:560px){.revgrid{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="hud"><span><b id="cur">01</b> / <span id="tot">00</span></span><span class="k" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶ F</span></div>
<nav id="rail"></nav>
<main id="deck"></main>

<script>
const SHOW_ADMIN = __SHOW_ADMIN__;

const LEVELS = [
  {id:'intro', label:'Início'},
  {id:'imob',  label:'Imobiliária & Corretor'},
  {id:'const', label:'Construtora'},
  {id:'fundo', label:'Fundo'},
  {id:'com',   label:'Comercial'},
  ...(SHOW_ADMIN?[{id:'admin', label:'Administração'}]:[]),
  {id:'fim',   label:'Fim'},
];

const appShell = (items, active, main, base='painel') => `
<div class="browser"><div class="top"><i></i><i></i><i></i><div class="url">antecipaqui.digital/${base}/<b>${active.toLowerCase().replace(/\\s|&/g,'-')}</b></div></div>
<div class="app">
  <div class="side">
    <div class="lg"><span class="m"></span> antecipaqui</div>
    ${items.map(n=>`<div class="nv ${n===active?'on':''}"><span class="ic"></span>${n}</div>`).join('')}
  </div>
  <div class="main">${main}</div>
</div></div>`;

const IMOB_NAV = ['Atendimentos','Operações','Link de Dados','Projeção','Equipe','Chats'];
const CONST_NAV = ['Operações','Duplicatas','Extrato','Risco','Score','Cashback','Documentos'];
const FUNDO_NAV = ['Aprovar','Operações','Daily','Recebimentos','Faturas','Risco','Regras','API'];
const COM_NAV = ['Operações','Prospects','Pipeline','Daily','Comissões','Relatórios'];
const ADMIN_NAV = ['Operações','Usuários','Construtoras','Tickets','Mural','Relatórios','Config'];

const phone = (scr) => `<div class="phone"><div class="notch"></div><div class="scr">${scr}</div></div>`;

const SLIDES = [];
const S = (o)=>SLIDES.push(o);

/* ========================= CAPA ========================= */
S({type:'cover'});
S({type:'value'});
S({type:'levelmap'});

/* ========================= 01 IMOBILIÁRIA & CORRETOR ========================= */
S({type:'intro', level:'imob', no:'01', who:'Para quem vende imóvel', title:'Imobiliária & Corretor',
  desc:'A venda parcelou a comissão em 24 vezes — mas a conta do corretor vence esse mês. Aqui ele cadastra a operação, assina digital e recebe a comissão à vista. O resto (cobrança, parcelas, risco) vira problema da plataforma.',
  idx:['Nova operação & simulação','Link de Dados do comprador','Da venda ao PIX','Contrato digital','Acompanhamento de operações','Projeção & relatórios','Equipe, convites & chats']});

S({level:'imob', n:'Nova operação & simulação', title:['Simule e veja ','o dinheiro na tela'],
  kid:'O corretor informa a comissão parcelada e a plataforma <b>calcula na hora</b> quanto sai à vista, com o deságio aberto — sem letra miúda. Gostou do número? <span class="em">Já cadastra a operação ali mesmo</span>.',
  pills:['Simulação transparente','Deságio aberto, sem surpresa','Parcelas importadas em lote','Operações em lote pra imobiliária'],
  mock: phone(`
    <div style="font-family:var(--disp);font-weight:800;font-size:13px;margin-bottom:8px">Simular antecipação</div>
    <div class="card" style="margin-bottom:8px"><div class="h">Sua comissão</div>
      <div style="font-family:var(--disp);font-weight:800;font-size:20px">R$ 48.000</div>
      <div style="font-size:10px;color:var(--mut)">24 parcelas de R$ 2.000 · começa em ago/26</div>
    </div>
    <div class="big-money"><small>Você recebe hoje</small><b>R$ 33.406</b><div style="font-size:9.5px;opacity:.8;margin-top:2px">taxa de 6% a.m. aplicada sobre cada parcela</div></div>
    <div style="background:linear-gradient(135deg,var(--a-vivid),var(--a-deep));border-radius:10px;padding:10px;text-align:center;font-family:var(--disp);font-weight:800;font-size:12px">Quero antecipar →</div>`)});

S({level:'imob', n:'Link de Dados', title:['O comprador preenche ','sozinho'],
  kid:'Cadê o RG do comprador? O contrato da venda? Em vez de caçar documento no WhatsApp, o corretor manda um <b>link</b> — o comprador preenche os dados e sobe os arquivos <span class="em">direto na operação</span>.',

  else if(s.type==='revenue'){
    el.innerHTML=`<div class="glow a"></div><div class="glow b"></div>
      <div style="position:relative;z-index:2;width:100%;max-width:1300px;margin:0 auto">
        <div class="kick">O modelo de negócio</div>
        <h2 class="sec">AQ é a tecnologia. <span style="color:var(--a-soft)">O capital é dos fundos.</span></h2>
        <p class="lead">Sem balanço alavancado: a plataforma origina, organiza e opera — e é remunerada em cada operação, com risco de crédito no fundo.</p>
        <div class="revgrid">
          <div class="rev"><div class="ic">⚖️</div><h4>Spread dividido</h4><p>Diferença entre a taxa da operação (ex. <b>6% a.m.</b>) e o custo do capital (ex. <b>2,4% a.m.</b>) — dividida meio a meio com o fundo.</p></div>
          <div class="rev"><div class="ic">🧾</div><h4>Custos da operação</h4><p>Tarifas de contrato, assinatura e serviços da esteira: <b>100% receita da plataforma</b>, cobradas dentro da operação.</p></div>
          <div class="rev"><div class="ic">🔁</div><h4>Receita recorrente</h4><p>O invoice pro fundo é <b>proporcional ao que foi pago</b> — cada parcela quitada gera repasse. Operação de 24x = 24 meses de receita.</p></div>
          <div class="rev"><div class="ic">🛡️</div><h4>Sem risco de crédito</h4><p>Quem compra o recebível é o fundo. A plataforma não empresta — <b>escala sem consumir capital</b>.</p></div>
          <div class="rev"><div class="ic">📈</div><h4>Originação composta</h4><p>Comerciais com carteira vitalícia + imobiliárias operando recorrente = volume que cresce sem mídia paga.</p></div>
          <div class="rev"><div class="ic">🔌</div><h4>Plataforma multi-fundo</h4><p>Cada fundo novo pluga com seu modo operacional e suas regras — <b>a mesma esteira atende N fundos</b> concorrendo pelas operações.</p></div>
        </div>
      </div>`;
  }
  else if(s.type==='end'){
    el.id='end';
    el.innerHTML=`<div class="glow a"></div><div class="glow b"></div>
      <div style="position:relative;z-index:3">
        <div class="wordmark"><span class="am">A</span>antecipa<b>qui</b></div>
        <div class="kick">Vamos destravar comissões?</div>
        <h2 class="big" style="font-size:clamp(34px,4.6vw,64px)">O crédito é bom. <span class="l">Agora o fluxo também é.</span></h2>
        <p class="lead" style="margin:14px auto 0;text-align:center;max-width:60ch">Plataforma em produção com fundo ativo, contrato digital, cobrança automatizada e API pronta pra plugar novos fundos e parceiros.</p>
        <div class="cta">Falar com a Antecipaqui →</div>
        <div class="contact"><b>www.antecipaqui.digital</b></div>
      </div>`;
  }
  else{
    const mockHtml = (s.n==='Esteira de operações') ? esteiraMock : s.mock;
    el.innerHTML=`<div class="glow a"></div><div class="glow b"></div>
      <div class="feat">
        <div class="txt">
          <div class="num">${String(i).padStart(2,'0')} · ${levelName(lvl)}</div>
          <div class="kick" style="margin-top:10px">${s.n}</div>
          <h2>${s.title.map((t,k)=>k%2?`<span class="hl">${t}</span>`:t).join('')}</h2>
          <p class="kid">${s.kid}</p>
          <div class="pills">${(s.pills||[]).map((p,k)=>`<span class="pill ${k===0?'acc':''}">${p}</span>`).join('')}</div>
        </div>
        <div class="mockwrap">${mockHtml}</div>
      </div>`;
  }
  deck.appendChild(el);
});

const railEl=document.getElementById('rail');
const firstOf={};
secOrder.forEach((lvl,i)=>{if(firstOf[lvl]===undefined)firstOf[lvl]=i});
LEVELS.forEach(l=>{
  if(firstOf[l.id]===undefined)return;
  const a=document.createElement('a');
  a.href='#';a.dataset.lvl=l.id;
  a.innerHTML=`<span class="d"></span><span class="t">${l.label}</span>`;
  a.onclick=(e)=>{e.preventDefault();goTo(firstOf[l.id])};
  railEl.appendChild(a);
});

const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=String(slides.length).padStart(2,'0');
let idx=0;
function goTo(i){idx=Math.max(0,Math.min(slides.length-1,i));slides[idx].scrollIntoView()}
function next(){goTo(idx+1)} function prev(){goTo(idx-1)}

const io=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){
    idx=+e.target.dataset.i;
    document.getElementById('cur').textContent=String(idx+1).padStart(2,'0');
    document.getElementById('bar').firstElementChild.style.width=((idx)/(slides.length-1)*100)+'%';
    const lvl=e.target.dataset.level;
    [...railEl.children].forEach(a=>a.classList.toggle('on',a.dataset.lvl===lvl));
  }});
},{threshold:.55});
slides.forEach(s=>io.observe(s));

addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();next()}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}
  if(e.key==='Home')goTo(0);if(e.key==='End')goTo(slides.length-1);
  if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
});
</script>
